<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd3f1"/><stop offset=".5" stop-color="#c9b6ff"/><stop offset="1" stop-color="#9fe3ff"/></linearGradient></defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
<g transform="translate(152 150) scale(3.6)">
    <defs>
      <linearGradient id="gScale" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#343a78"/>
        <stop offset=".55" stop-color="#1f2350"/>
        <stop offset="1" stop-color="#14163a"/>
      </linearGradient>
      <linearGradient id="gBelly" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a4f99"/>
        <stop offset="1" stop-color="#2c3070"/>
      </linearGradient>
      <radialGradient id="gIris" cx=".45" cy=".4" r=".65">
        <stop offset="0" stop-color="#e6fff6"/>
        <stop offset=".35" stop-color="#6ff5c9"/>
        <stop offset=".72" stop-color="#22b3a6"/>
        <stop offset="1" stop-color="#2a4fa0"/>
      </radialGradient>
      <linearGradient id="gHorn" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#ffe7a8"/>
        <stop offset=".5" stop-color="#ffd0f0"/>
        <stop offset="1" stop-color="#c8f0ff"/>
      </linearGradient>
      <linearGradient id="gWing" x1="1" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#6a4cff"/>
        <stop offset=".5" stop-color="#3ab8ff"/>
        <stop offset="1" stop-color="#ff86d6"/>
      </linearGradient>
      <linearGradient id="gFin" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff9ad8"/>
        <stop offset="1" stop-color="#9b7dff"/>
      </linearGradient>
      <radialGradient id="gShadow">
        <stop offset="0" stop-color="#000" stop-opacity=".35"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <ellipse cx="100" cy="189" rx="52" ry="7" fill="url(#gShadow)"/>

    <g id="whole">
      <!-- tail -->
      <g id="tail">
        <path d="M122,170 C146,184 176,180 186,164" fill="none" stroke="url(#gScale)" stroke-width="12" stroke-linecap="round"/>
        <path d="M124,172 C146,184 172,180 182,168" fill="none" stroke="#4a50a0" stroke-width="2" stroke-linecap="round" opacity=".5"/>
        <path d="M186,166 C178,156 180,145 187,147 C190,139 199,142 198,151 C197,160 192,164 186,166 Z" fill="url(#gFin)"/>
        <path d="M186,166 C183,158 185,151 188,149" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/>
      </g>

      <!-- wings -->
      <g id="wingL"><g class="wing">
        <path d="M76,130 C62,110 42,98 20,95 C27,106 25,113 29,120 C21,122 16,129 16,136 C25,133 34,135 38,142 C46,137 58,138 72,148 Z" fill="url(#gWing)" opacity=".88"/>
        <path d="M76,130 C62,110 42,98 20,95 M58,124 C46,120 36,120 29,120 M60,134 C50,134 42,136 38,142" fill="none" stroke="#1a1c44" stroke-width="2.2" stroke-linecap="round"/>
      </g></g>
      <g id="wingR" transform="translate(200 0) scale(-1 1)"><g class="wing">
        <path d="M76,130 C62,110 42,98 20,95 C27,106 25,113 29,120 C21,122 16,129 16,136 C25,133 34,135 38,142 C46,137 58,138 72,148 Z" fill="url(#gWing)" opacity=".88"/>
        <path d="M76,130 C62,110 42,98 20,95 M58,124 C46,120 36,120 29,120 M60,134 C50,134 42,136 38,142" fill="none" stroke="#1a1c44" stroke-width="2.2" stroke-linecap="round"/>
      </g></g>

      <!-- body -->
      <g id="bodyG">
        <ellipse cx="74" cy="180" rx="15" ry="8.5" fill="url(#gScale)"/>
        <ellipse cx="126" cy="180" rx="15" ry="8.5" fill="url(#gScale)"/>
        <ellipse cx="100" cy="148" rx="40" ry="36" fill="url(#gScale)"/>
        <ellipse cx="100" cy="157" rx="24" ry="25" fill="url(#gBelly)"/>
        <path d="M82,148 Q100,153 118,148 M80,158 Q100,163 120,158 M83,168 Q100,173 117,168" fill="none" stroke="#6a70c0" stroke-width="1.3" opacity=".55"/>
        <ellipse cx="86" cy="173" rx="9.5" ry="8" fill="#2a2f66"/>
        <ellipse cx="114" cy="173" rx="9.5" ry="8" fill="#2a2f66"/>
        <path d="M81,178 v2 M86,179 v2 M91,178 v2 M109,178 v2 M114,179 v2 M119,178 v2" stroke="#e8e6ff" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
        <circle class="twinkle" cx="76" cy="140" r="1.2" fill="#fff"/>
        <circle class="twinkle" cx="124" cy="136" r="1.1" fill="#fff"/>
        <circle class="twinkle" cx="70" cy="158" r="1" fill="#fff"/>
        <circle class="twinkle" cx="131" cy="160" r="1.2" fill="#fff"/>
      </g>

      <!-- head -->
      <g id="head">
        <g id="earL">
          <path d="M64,72 C48,58 32,46 14,44 C22,55 30,67 40,77 C47,84 56,86 63,83 Z" fill="url(#gScale)"/>
          <path d="M60,74 C48,64 36,55 24,51" fill="none" stroke="url(#gFin)" stroke-width="2" stroke-linecap="round" opacity=".8"/>
          <path d="M58,90 C44,87 30,85 18,89 C28,96 40,100 54,99 Z" fill="url(#gScale)"/>
        </g>
        <g id="earR">
          <path d="M136,72 C152,58 168,46 186,44 C178,55 170,67 160,77 C153,84 144,86 137,83 Z" fill="url(#gScale)"/>
          <path d="M140,74 C152,64 164,55 176,51" fill="none" stroke="url(#gFin)" stroke-width="2" stroke-linecap="round" opacity=".8"/>
          <path d="M142,90 C156,87 170,85 182,89 C172,96 160,100 146,99 Z" fill="url(#gScale)"/>
        </g>

        <!-- mane (back tufts) -->
        <path d="M78,60 C64,50 64,34 73,27 C73,40 82,50 92,55 Z" fill="#8fd8ff"/>
        <path d="M120,58 C132,47 146,45 152,53 C141,53 132,59 125,66 Z" fill="#8ff5cf"/>

        <ellipse cx="100" cy="90" rx="51" ry="42" fill="url(#gScale)"/>
        <ellipse cx="100" cy="101" rx="47" ry="33" fill="url(#gScale)"/>
        <ellipse cx="80" cy="66" rx="22" ry="9" fill="#fff" opacity=".1" transform="rotate(-22 80 66)"/>

        <!-- mane (top tufts) -->
        <path d="M86,54 C78,37 85,23 98,21 C92,32 95,42 102,52 Z" fill="#ff8ad8"/>
        <path d="M100,52 C101,35 112,25 125,27 C114,33 111,43 113,55 Z" fill="#b79bff"/>
        <path d="M86,54 C80,44 84,34 90,30" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M104,52 C117,54 122,63 117,72 C115,63 108,59 99,59 Z" fill="#ff8ad8" opacity=".95"/>

        <!-- horn -->
        <g id="horn">
          <path d="M93,55 L100,12 L107,55 Q100,59 93,55 Z" fill="url(#gHorn)"/>
          <path d="M94.5,47 L105.5,42 M95.6,38 L104.4,33.5 M96.7,29.5 L103.3,25.5 M97.8,21 L102,18.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>
        </g>

        <!-- cheeks -->
        <ellipse cx="61" cy="113" rx="9" ry="5" fill="#ff8ad8" opacity=".42"/>
        <ellipse cx="139" cy="113" rx="9" ry="5" fill="#ff8ad8" opacity=".42"/>
        <circle class="twinkle" cx="56" cy="104" r="1.1" fill="#fff"/>
        <circle class="twinkle" cx="144" cy="104" r="1.1" fill="#fff"/>
        <circle class="twinkle" cx="62" cy="101" r=".9" fill="#fff"/>
        <circle class="twinkle" cx="138" cy="101" r=".9" fill="#fff"/>

        <!-- eyes -->
        <g class="eye" id="eyeL">
          <ellipse cx="78" cy="97" rx="15" ry="17" fill="url(#gIris)" stroke="#0b0d1f" stroke-width="2"/>
          <g class="pupils">
            <ellipse cx="79" cy="99" rx="5.5" ry="10" fill="#0b0d1f"/>
            <circle cx="73" cy="90" r="4.6" fill="#fff"/>
            <circle cx="84" cy="105" r="2" fill="#fff" opacity=".85"/>
          </g>
        </g>
        <g class="eye" id="eyeR">
          <ellipse cx="122" cy="97" rx="15" ry="17" fill="url(#gIris)" stroke="#0b0d1f" stroke-width="2"/>
          <g class="pupils">
            <ellipse cx="121" cy="99" rx="5.5" ry="10" fill="#0b0d1f"/>
            <circle cx="115" cy="90" r="4.6" fill="#fff"/>
            <circle cx="126" cy="105" r="2" fill="#fff" opacity=".85"/>
          </g>
        </g>
        <g opacity="0" fill="none" stroke="#9ff5d8" stroke-width="4" stroke-linecap="round">
          <path d="M66,100 Q78,86 90,100"/>
          <path d="M110,100 Q122,86 134,100"/>
        </g>
        <g opacity="0" fill="none" stroke="#9ff5d8" stroke-width="3.2" stroke-linecap="round">
          <path d="M67,98 Q78,105 89,98"/>
          <path d="M111,98 Q122,105 133,98"/>
        </g>

        <!-- nose & mouth -->
        <circle cx="94.5" cy="113" r="1.6" fill="#0b0d1f" opacity=".75"/>
        <circle cx="105.5" cy="113" r="1.6" fill="#0b0d1f" opacity=".75"/>
        <path class="mouth-closed" d="M91,119 Q100,126 109,119" fill="none" stroke="#0b0d1f" stroke-width="2.3" stroke-linecap="round"/>
        <g opacity="0">
          <path d="M92,118 Q100,131 108,118 Z" fill="#3a1236" stroke="#0b0d1f" stroke-width="2" stroke-linejoin="round"/>
          <ellipse cx="100" cy="124.5" rx="3.6" ry="2.2" fill="#ff8fb8"/>
        </g>
      </g>

      <g opacity="0" fill="#cfe0ff" font-family="ui-rounded, -apple-system" font-weight="700">
        <text x="150" y="60" font-size="12">z</text>
        <text x="158" y="48" font-size="14">z</text>
        <text x="166" y="34" font-size="17">Z</text>
      </g>
    </g>
  </g>
</svg>